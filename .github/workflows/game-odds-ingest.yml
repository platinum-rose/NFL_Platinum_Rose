# GameOddsIngestAgent — captures spread/moneyline/total snapshots for upcoming NFL games
#
# Required repo secrets (Settings > Secrets > Actions):
#   ODDS_API_KEY              — TheOddsAPI key
#   SUPABASE_URL              — https://aambmuzfcojxqvbzhngp.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — service_role JWT
#
# Single source of truth (2026-09-24): the ONLY scheduled TheOddsAPI game-odds
# caller. Writes game_odds_snapshots AND derives line_movements (odds-ingest.yml
# is retired); the local toolbox sync reads game_odds_snapshots (0 credits).
#
# Rate budget (TheOddsAPI bills markets × regions = 3 credits per run):
#   11 runs/week × 3 = 33 credits/week ≈ 143/month
#   + futures-odds-ingest (2×/week) ≈ 50/month → ~200 of the 500 free credits.
#   The agent skips itself when fewer than ODDS_QUOTA_FLOOR (15) credits remain;
#   use the `force` input to spend the reserve (e.g. Sunday closing lines).
# Times (UTC; PT = UTC-7 until Nov 1, then UTC-8):
#   Sun 14:30 / 16:30 / 19:30 / 23:30 — morning, pre-early, pre-late, pre-SNF
#   Mon 23:30 pre-MNF · Thu 23:30 pre-TNF · Tue–Sat 16:30 daily
#
# Offseason behavior:
#   TheOddsAPI returns 404/422 when no NFL games are scheduled.
#   The agent handles this gracefully — logs and exits cleanly, no error.

name: Game Odds Ingest

on:
  schedule:
    - cron: '30 14,16,19,23 * * 0'   # Sunday: morning, pre-1pm ET, pre-4pm ET, pre-SNF
    - cron: '30 23 * * 1'            # Monday pre-MNF
    - cron: '30 16 * * 2-6'          # Tue–Sat daily snapshot
    - cron: '30 23 * * 4'            # Thursday pre-TNF
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the quota floor (spend the reserve credits)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (fetch + parse only, no Supabase writes)'
        required: false
        default: false
        type: boolean
      season:
        description: 'Season year override (default: current year)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  game-odds-ingest:
    name: Fetch game odds + write snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run GameOddsIngestAgent
        env:
          ODDS_API_KEY:              ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN:                   ${{ inputs.dry_run || 'false' }}
          GAME_ODDS_SEASON:          ${{ inputs.season || '' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season ${{ inputs.season }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node agents/game-odds-ingest.js $ARGS

      - name: Log completion
        if: success()
        run: echo "✅ Game odds snapshot captured at $(date -u)"

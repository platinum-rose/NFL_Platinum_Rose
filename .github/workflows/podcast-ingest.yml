name: Podcast Ingest Agent

on:
  schedule:
    - cron: '30 8 * * 2,3,4,5'   # Tue-Fri at 08:30 UTC (in-season: recaps, deep dives, TNF & weekend props)
  workflow_dispatch:         # Manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Dry run (discover only, no transcription)'
        required: false
        default: false
        type: boolean
      max_per_run:
        description: 'Max episodes to process per run'
        required: false
        default: '6'
        type: string

jobs:
  podcast-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run PodcastIngestAgent
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}         # optional — free Whisper; takes priority over AssemblyAI
          ASSEMBLYAI_API_KEY:        ${{ secrets.ASSEMBLYAI_API_KEY }}   # optional — fallback if Groq rate-limited
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}    # optional — pick/intel extraction fallback #1 if GPT-4o fails (e.g. out of credits)
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}       # optional — pick/intel extraction fallback #2
          DRY_RUN:                   ${{ inputs.dry_run || 'false' }}
          MAX_PER_RUN:               ${{ inputs.max_per_run || '3' }}
        run: node agents/podcast-ingest.js

name: Player Injury Ingest

on:
  schedule:
    # Mon 14:00 UTC (10 AM ET) — post-weekend injury recap & waiver prep
    - cron: '0 14 * * 1'
    # Wed 14:00 UTC (10 AM ET) — mid-week 1st official practice report
    - cron: '0 14 * * 3'
    # Thu 14:00 UTC (10 AM ET) — Thursday practice reports
    - cron: '0 14 * * 4'
    # Fri 18:00 UTC (2 PM ET) — official Friday final game designations (Out/Doubtful/Questionable)
    - cron: '0 18 * * 5'
    # Sun 15:45 UTC (11:45 AM ET) — Sunday early window official 90-min inactives (1:00 PM kickoffs)
    - cron: '45 15 * * 0'
    # Sun 19:15 UTC (3:15 PM ET) — Sunday late window official 90-min inactives (4:05/4:25 PM kickoffs)
    - cron: '15 19 * * 0'
    # Sun/Mon/Thu 23:00 UTC (7:00 PM ET) — Primetime official 90-min inactives (TNF, SNF, MNF)
    - cron: '0 23 * * 0,1,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch + parse only, no Supabase writes)'
        type: boolean
        default: true
      status_filter:
        description: >
          Comma-separated statuses to capture (blank = all non-trivial).
          e.g. "Out,Doubtful,Questionable,Probable"
        type: string
        required: false

jobs:
  injury-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run InjuryIngestAgent
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN:                   ${{ inputs.dry_run || 'false' }}
          INJURY_STATUS_FILTER:      ${{ inputs.status_filter || '' }}
        run: node agents/injury-ingest.js

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: injury-ingest-receipt-${{ github.run_number }}
          path: .nfl/receipts/injury-ingest-*.json
          retention-days: 30

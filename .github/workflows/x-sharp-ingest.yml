name: X Sharp-Account Ingest Agent

# DISABLED 2026-09-15: no real data received since 2026-06-02 (last
# .nfl/receipts/x-sharp-ingest-*.json receipt is
# x-sharp-ingest-2026-06-02T21-20-37-754.json; agents/x-sharp-ingest.js and
# this workflow have had no commits since 2026-06-02 either). Superseded by
# the Antigravity Twitter/X harvester (scripts/twitter-bookmarks-cron.js,
# spec: docs/specs/TWITTER_X_AUTOMATED_HARVESTER_SPEC_2026-08-31.md), which
# covers both personal bookmarks and tracked sharp-account timelines and is
# actively producing fresh data (.nfl/reports/twitter-bookmarks/ has entries
# through 2026-09-13). Scheduled trigger removed below; workflow_dispatch
# kept so this can still be run manually if ever needed.
# See git commit disabling this file for full evidence.

on:
  # schedule:
  #   - cron: '30 */4 * * *'        # Every 4h offseason (30-min offset from other agents)
  #   - cron: '30 * * * 0,1,4'      # Hourly on Sun/Mon/Thu (game days)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch + parse only, no Supabase writes)'
        required: false
        default: false
        type: boolean
      lookback_hours:
        description: 'Hours to look back for new tweets'
        required: false
        default: '48'
        type: string
      limit_per_account:
        description: 'Max tweets to process per account'
        required: false
        default: '20'
        type: string

jobs:
  x-sharp-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run XSharpIngestAgent
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: override with your self-hosted RSSHub instance for
          # higher reliability. The public rsshub.app is the default.
          RSSHUB_BASE_URL:           ${{ secrets.RSSHUB_BASE_URL || 'https://rsshub.app' }}
          DRY_RUN:                   ${{ inputs.dry_run || 'false' }}
          X_LOOKBACK_HOURS:          ${{ inputs.lookback_hours || '48' }}
          X_LIMIT_PER_ACCOUNT:       ${{ inputs.limit_per_account || '20' }}
        run: node agents/x-sharp-ingest.js

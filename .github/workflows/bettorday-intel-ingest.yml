name: BettorDay Intel Ingest Agent

# Scheduled + wired 2026-09-02, after independent audit
# (docs/specs/BETTORDAY_INTEL_PIPELINE_AUDIT_RESPONSE_2026-09-02.md) and the
# e95137d trench-table-conflation fix. Requires migration
# supabase/migrations/053_bettorday_intel.sql to be run first (Supabase
# Dashboard -> SQL Editor) -- until then this workflow still runs safely
# (the agent falls back to local-file-only receipts when Supabase
# creds/tables aren't available, same fail-open convention as
# research-intel-ingest.yml), it just won't sync to Supabase.

on:
  schedule:
    # BettorDay publishes daily ~6:00 AM ET (10:00/11:00 UTC depending on
    # DST). Run once daily at 13:00 UTC to land comfortably after every
    # day's edition, including the trench report if BettorDay republishes
    # it mid-week.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch + parse only, no Supabase writes)'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Max newsletter editions to process'
        required: false
        default: '10'
        type: string

jobs:
  bettorday-intel-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run BettorDay ingest agent
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--season 2026 --limit ${{ inputs.limit || '10' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node agents/bettorday-newsletter-ingest.js $ARGS

      - name: Upload receipts as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bettorday-receipts
          path: |
            .nfl/receipts/bettorday_newsletters_*.json
            data/intel/bettorday_trench_ratings_2026.json
          retention-days: 14
          if-no-files-found: ignore

name: intel-to-vault-sync

on:
  schedule:
    # Daily 10:00 UTC — after the overnight research-intel run (9pm UTC the
    # prior day) and Twitter bookmarks/tracked-accounts ingestion, so
    # vault_notes (and the committee's synthesis prompt via
    # loadVaultReferenceEvidence()) refreshes daily instead of twice weekly.
    # Was Mon/Thu-only (2026-08-3x) -- changed 2026-09-01 at Andy's request,
    # with the season starting; twice-weekly meant up to ~3-4 days of lag
    # on newly-ingested intel (including Twitter) reaching the committee.
    # INTEL_LOOKBACK_DAYS defaults to 7, so a daily cadence just re-scans a
    # bigger recent window each time -- no gap risk from the tighter cadence.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to vault_notes)'
        type: boolean
        default: true
      week:
        description: 'NFL week number (e.g. 5) — added to intel section header'
        type: string
        required: false
      team:
        description: 'Single team abbreviation to update (e.g. KC). Leave blank for all.'
        type: string
        required: false
      lookback_days:
        description: 'How many days of intel to scan (default: 7)'
        type: string
        default: '7'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run intel-to-vault-sync
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN:    ${{ inputs.dry_run || 'false' }}
          INTEL_LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ inputs.week }}"
          fi
          if [ -n "${{ inputs.team }}" ]; then
            ARGS="$ARGS --team ${{ inputs.team }}"
          fi
          node agents/intel-to-vault-sync.js $ARGS

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-vault-receipt-${{ github.run_number }}
          path: .nfl/receipts/intel-vault-*.json
          retention-days: 30
